<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감자 마켓 - 상품 상세 모달</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* =========================================================
       1. 변수 및 전역 스타일 (브라운 포인트 테마)
       ========================================================= */
    :root {
      --primary-color: #8C5A3C;       /* 메인 브라운 */
      --primary-dark: #704428;        /* 진한 브라운 (호버/강조) */
      --primary-light: #F4EBE1;       /* 연한 브라운 배지 배경 */
      --bg-cream: #FAF7F2;            /* 메인 크림/아이보리 배경 */
      --surface-white: #FFFFFF;       /* 카드/모달 흰색 배경 */
      --text-dark: #2B2521;           /* 메인 텍스트 */
      --text-sub: #7A726B;            /* 서브 텍스트 */
      --border-color: #E8E2D9;        /* 테두리 색상 */
      --status-on-sale: #28A745;       /* 판매중 - 초록 */
      --status-reserved: #FF9F43;      /* 예약중 - 주황 */
      --status-completed: #8395A7;     /* 거래완료 - 회색 */
      --shadow-sm: 0 2px 8px rgba(140, 90, 60, 0.08);
      --shadow-md: 0 12px 32px rgba(140, 90, 60, 0.15);
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --font-main: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-cream);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* =========================================================
       데모 페이지 레이아웃 (상품 카드 클릭 시 모달 열기)
       ========================================================= */
    .demo-container {
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    .demo-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 20px;
    }

    .product-card {
      background: var(--surface-white);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .product-card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background-color: #EFEAE4;
    }

    .product-card-body {
      padding: 16px;
      text-align: left;
    }

    .product-card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .product-card-price {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-color);
    }

    /* =========================================================
       2. 상세 모달 (Modal) CSS & 애니메이션
       ========================================================= */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(43, 37, 33, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      padding: 16px;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-container {
      background-color: var(--surface-white);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transform: translateY(20px) scale(0.96);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .modal-container {
      transform: translateY(0) scale(1);
    }

    /* [X] 닫기 버튼 */
    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(4px);
      color: var(--text-dark);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .close-btn:hover {
      background-color: var(--surface-white);
      transform: scale(1.1);
    }

    /* 모달 스크롤 가능 영역 */
    .modal-content-scroll {
      overflow-y: auto;
      flex: 1;
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) transparent;
    }

    /* 위쪽 절반: 상품 대표 이미지 */
    .image-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background-color: #F2ECE4;
      overflow: hidden;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 아래쪽 영역 */
    .modal-body {
      padding: 24px;
      background-color: var(--surface-white);
    }

    /* 판매 상태 & 카테고리 헤더 */
    .status-category-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: white;
    }

    .badge.on-sale {
      background-color: var(--status-on-sale);
    }

    .badge.reserved {
      background-color: var(--status-reserved);
    }

    .badge.completed {
      background-color: var(--status-completed);
    }

    .category {
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 500;
    }

    /* 상품명 & 메타정보 & 가격 */
    .product-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .product-meta {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 16px;
    }

    .product-price {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary-dark);
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    /* 상세 본문 설명 */
    .product-description {
      font-size: 15px;
      line-height: 1.6;
      color: #4A443F;
      white-space: pre-line;
      margin-bottom: 24px;
    }

    /* 판매자 정보 카드 */
    .seller-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background-color: var(--bg-cream);
      padding: 14px 18px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      margin-bottom: 8px;
    }

    .seller-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--surface-white);
    }

    .seller-info {
      display: flex;
      flex-direction: column;
    }

    .seller-nickname {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .seller-location {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* 맨 아래 하단 고정 버튼 영역 */
    .modal-footer {
      padding: 16px 24px;
      background-color: var(--surface-white);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
    }

    .btn-like {
      flex: 1;
      height: 50px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background-color: var(--bg-cream);
      color: var(--text-dark);
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-like:hover {
      background-color: #F4ECE1;
    }

    .btn-chat {
      flex: 2;
      height: 50px;
      border-radius: var(--radius-sm);
      border: none;
      background-color: var(--primary-color);
      color: white;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-chat:hover {
      background-color: var(--primary-dark);
    }

    .btn-chat:active {
      transform: scale(0.98);
    }

    /* 모바일 반응형 처리 */
    @media (max-width: 576px) {
      .modal-overlay {
        padding: 0;
        align-items: flex-end;
      }

      .modal-container {
        max-width: 100%;
        max-height: 92vh;
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
        transform: translateY(100%);
      }

      .modal-overlay.active .modal-container {
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <!-- 데모 클릭 영역 -->
  <div class="demo-container">
    <h1 class="demo-title">🥔 감자 마켓</h1>
    <div class="product-card" onclick="openDetailModal()">
      <img src="https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=600&q=80" alt="상품 이미지" class="product-card-img" />
      <div class="product-card-body">
        <h3 class="product-card-title">클래식 빈티지 독서대 (감자 추천)</h3>
        <p class="product-card-price">25,000원</p>
      </div>
    </div>
    <p style="margin-top: 12px; font-size: 13px; color: #7A726B;">👆 카드를 클릭하면 상세 모달이 열립니다.</p>
  </div>

  <!-- [화면 2] 상세 팝업 (모달) -->
  <div class="modal-overlay" id="detailModal" onclick="handleOverlayClick(event)">
    <div class="modal-container">
      
      <!-- 상단 우측 [X] 닫기 버튼 -->
      <button class="close-btn" onclick="closeDetailModal()" aria-label="닫기">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <!-- 스크롤 가능 영역 -->
      <div class="modal-content-scroll">
        <!-- 위쪽 절반: 대표 이미지 -->
        <div class="image-wrapper">
          <img src="https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=800&q=80" alt="상세 대표 이미지" />
        </div>

        <!-- 아래쪽 상세 영역 -->
        <div class="modal-body">
          <!-- 상태 및 카테고리 -->
          <div class="status-category-row">
            <span class="badge on-sale">판매중</span>
            <span class="category">디지털기기 / 가구</span>
          </div>

          <!-- 상품명 -->
          <h2 class="product-title">클래식 빈티지 원목 독서대 (상태 최상)</h2>

          <!-- 판매 위치 & 업로드 시간 -->
          <p class="product-meta">서울 마포구 연남동 · 1시간 전</p>

          <!-- 가격 -->
          <p class="product-price">25,000원</p>

          <!-- 상품 설명 -->
          <div class="product-description">
            깨끗하게 사용한 원목 독서대 판매합니다 🥔
            
            각도 조절 5단계 가능하고 두꺼운 책도 튼튼하게 잘 받쳐줍니다.
            스크래치나 오염 전혀 없는 S급 상태입니다!

            직거래는 연남동 주민센터 근처나 홍대입구역에서 가능합니다.
            편하게 채팅 주세요!
          </div>

          <!-- 판매자 정보 카드 -->
          <div class="seller-card">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="판매자 프로필" class="seller-avatar" />
            <div class="seller-info">
              <span class="seller-nickname">포실포실감자</span>
              <span class="seller-location">마포구 성산동</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 맨 아래 하단 고정 버튼 2개 -->
      <div class="modal-footer">
        <button class="btn-like">
          <i class="fa-regular fa-heart"></i> 관심 추가
        </button>
        <button class="btn-chat">
          <i class="fa-regular fa-comment-dots"></i> 채팅 시작하기
        </button>
      </div>

    </div>
  </div>

  <!-- JS 모달 제어 함수 스니펫 -->
  <script>
    const detailModal = document.getElementById('detailModal');

    /**
     * 상세 모달 열기
     */
    function openDetailModal() {
      detailModal.classList.add('active');
      document.body.style.overflow = 'hidden'; // 배경 스크롤 방지
    }

    /**
     * 상세 모달 닫기
     */
    function closeDetailModal() {
      detailModal.classList.remove('active');
      document.body.style.overflow = ''; // 배경 스크롤 원복
    }

    /**
     * 오버레이(배경) 클릭 시 모달 닫기
     */
    function handleOverlayClick(event) {
      if (event.target === detailModal) {
        closeDetailModal();
      }
    }

    // ESC 키 입력 시 모달 닫기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && detailModal.classList.contains('active')) {
        closeDetailModal();
      }
    });
  </script>
</body>
</html>
